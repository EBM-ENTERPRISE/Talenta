events {
    worker_connections 1024;
}

http {
    upstream backend_cluster {
        # Round Robin Load Balancing
        server backend-1:3000;
        server backend-2:3000;
        
        # We can add 'backup' or weights here, but standard round-robin 
        # demonstrates distribution well. Nginx handles failover automatically
        # if a host is unreachable (connect_timeout).
    }

    upstream frontend_cluster {
        server frontend-1:80;
        server frontend-2:80;
    }

    server {
        listen 80;

        # Frontend Routing
        location / {
            proxy_pass http://frontend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Failover for Frontend
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_connect_timeout 2s;
        }

        # API Routing
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Failover Configuration
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_connect_timeout 2s; # Fast failover
        }

        # Internal Sync Routing (Optional, but usually internal only. 
        # Here we expose everything on port 80 for simplicity of the demo network)
    }
}
