events {
    worker_connections 1024;
}

http {
    upstream backend_cluster {
        ip_hash;
        server backend-1:3000 max_fails=3 fail_timeout=10s;
        server backend-2:3000 max_fails=3 fail_timeout=10s;
    }

    upstream frontend_cluster {
        ip_hash;
        server frontend-1:80;
        server frontend-2:80;
    }

    server {
        listen 80;

        # Frontend Routing
        location / {
            proxy_pass http://frontend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            proxy_http_version 1.1;
        }

        # API Routing
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            proxy_http_version 1.1;
        }

        # Long-running Edge Functions (jobs/people scrapers)
        # Allow longer read/send timeouts so runs (e.g., Apify) can finish without 504
        # Avoid failover on 'timeout' to prevent switching mid-run; still failover on errors
        location /api/functions/v1/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_next_upstream error http_500 http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_http_version 1.1;
        }

    }
}
