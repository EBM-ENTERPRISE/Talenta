events {
    worker_connections 1024;
    use epoll; # Otimização para Linux
}

http {
    # 1. Logs Detalhados para Auditoria de Failover
    log_format upstream_time '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
                             'upstream="$upstream_addr"';

    access_log /var/log/nginx/access.log upstream_time;
    error_log /var/log/nginx/error.log warn;

    # 2. Otimizações de TCP e DNS
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Resolver DNS do Docker (Vital para Failover Dinâmico)
    resolver 127.0.0.11 valid=1s;
    resolver_timeout 2s;

    # 3. Compressão Gzip (Performance)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 4. Configurações Globais de Proxy (Resiliência)
    proxy_connect_timeout 5s; 
    proxy_send_timeout 60s;
    proxy_read_timeout 60s; # Aumentado para suportar Edge Functions lentas (scraping)
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 3; # Tenta no máximo 3 vezes antes de desistir

    # --- DEFINIÇÃO DOS CLUSTERS ---

    # Backend Cluster 1 (Prioridade: Backend 1)
    upstream backend_cluster_1 {
        zone backend_cluster_1 64k;
        # keepalive mantem conexões abertas para performance
        keepalive 16;
        
        server backend1:3001 max_fails=1 fail_timeout=5s;
        server backend2:3002 backup; 
    }

    # Backend Cluster 2 (Prioridade: Backend 2)
    upstream backend_cluster_2 {
        zone backend_cluster_2 64k;
        keepalive 16;
        
        server backend2:3002 max_fails=1 fail_timeout=5s;
        server backend1:3001 backup; 
    }

    # Frontend Cluster (Balanceamento de Carga da UI)
    upstream frontend_cluster {
        zone frontend_cluster 64k;
        ip_hash; # Garante que o usuário fique no mesmo frontend (Session Stickiness)
        
        server frontend-1:80 max_fails=1 fail_timeout=5s;
        server frontend-2:80 max_fails=1 fail_timeout=5s;
    }

    # --- SERVIDORES VIRTUAIS ---

    # API Gateway 1 (Porta 8081)
    server {
        listen 8081;
        server_name localhost;

        location / {
            # CORS Setup
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,apikey,x-client-info,Prefer';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                return 204;
            }

            # Remove headers vindos do upstream para evitar duplicidade
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Expose-Headers;

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,apikey,x-client-info,Prefer' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            proxy_pass http://backend_cluster_1;
            
            # Headers essenciais
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Headers de Debug (Mostra no navegador quem respondeu!)
            add_header X-Upstream-Address $upstream_addr always;
            add_header X-Cluster "Cluster 1 (Pref: Backend 1)" always;
            
            # Suporte a Keep-Alive no Upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # API Gateway 2 (Porta 8082)
    server {
        listen 8082;
        server_name localhost;

        location / {
            # CORS Setup
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,apikey,x-client-info,Prefer';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                return 204;
            }

            # Remove headers vindos do upstream para evitar duplicidade
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Expose-Headers;

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,apikey,x-client-info,Prefer' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            proxy_pass http://backend_cluster_2;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Headers de Debug
            add_header X-Upstream-Address $upstream_addr always;
            add_header X-Cluster "Cluster 2 (Pref: Backend 2)" always;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # UI Gateway (Porta 3000)
    server {
        listen 3000;
        server_name localhost;

        location / {
            proxy_pass http://frontend_cluster;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Headers de Debug
            add_header X-Frontend-Node $upstream_addr always;
            
            # Suporte a WebSocket (Vital para React/Vite HMR)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
