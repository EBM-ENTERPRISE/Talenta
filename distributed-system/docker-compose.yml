services:
  # --- CAMADA DE DADOS (Database Proxies) ---
  # Container que representa o Banco de Dados 1
  database-1:
    image: nginx:alpine
    volumes:
      - ./db-proxies/db1.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "54321:80" # Porta externa para debug se quiser
    restart: always

  # Container que representa o Banco de Dados 2
  database-2:
    image: nginx:alpine
    volumes:
      - ./db-proxies/db2.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "54322:80" # Porta externa para debug se quiser
    restart: always

  # --- CAMADA DE BACKEND ---
  # Backend 1 (Conecta no database-1)
  backend1:
    build: ./backend1
    ports:
      - "3001:3001"
    environment:
      # Agora aponta para o container local, não para a nuvem direta
      - SUPABASE_URL=http://database-1
      - SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJuaW5pbnhsbXhkbWNqb29xd2tjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk3MzM0NjcsImV4cCI6MjA3NTMwOTQ2N30.u3CByXWF-0KYXwiG0B8xp8_EfsCGDBXqh5oWFDBUPD8
      - PORT=3001
    depends_on:
      - database-1
    restart: always

  # Backend 2 (Conecta no database-2)
  backend2:
    build: ./backend2
    ports:
      - "3002:3002"
    environment:
      # Agora aponta para o container local
      - SUPABASE_URL=http://database-2
      - SUPABASE_KEY=sb_publishable_NRNv47SPp5eszqGxrwzjpw_NoZo7ERe
      - PORT=3002
    depends_on:
      - database-2
    restart: always

  # --- CAMADA DE FRONTEND ---
  # Frontend 1 (Supabase 1 -> LB 8081)
  frontend-1:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=http://localhost:8081
        - VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJuaW5pbnhsbXhkbWNqb29xd2tjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk3MzM0NjcsImV4cCI6MjA3NTMwOTQ2N30.u3CByXWF-0KYXwiG0B8xp8_EfsCGDBXqh5oWFDBUPD8
    ports:
      - "3051:80"
    restart: always

  # Frontend 2 (Supabase 2 -> LB 8082)
  frontend-2:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=http://localhost:8082
        - VITE_SUPABASE_ANON_KEY=sb_publishable_NRNv47SPp5eszqGxrwzjpw_NoZo7ERe
    ports:
      - "3052:80"
    restart: always

  # Load Balancer (Nginx)
  loadbalancer:
    image: nginx:alpine
    ports:
      - "8081:8081" # API Gateway 1
      - "8082:8082" # API Gateway 2
      - "3000:3000" # UI Gateway
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - frontend-1
      - frontend-2

  # Consistency Manager (Serviço de Sincronização de Dados)
  sync-service:
    build: ./sync-service
    environment:
      - SUPABASE_URL_1=http://database-1
      - SUPABASE_KEY_1=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJuaW5pbnhsbXhkbWNqb29xd2tjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk3MzM0NjcsImV4cCI6MjA3NTMwOTQ2N30.u3CByXWF-0KYXwiG0B8xp8_EfsCGDBXqh5oWFDBUPD8
      - SUPABASE_URL_2=http://database-2
      - SUPABASE_KEY_2=sb_publishable_NRNv47SPp5eszqGxrwzjpw_NoZo7ERe
    depends_on:
      - database-1
      - database-2
    restart: always
