version: '3.8'

services:
  # --- Load Balancer ---
  nginx:
    image: nginx:alpine
    ports:
      - "9090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - backend-1
      - backend-2
      - frontend-1
      - frontend-2

  # --- Backend Services ---
  backend-1:
    build: ./backend
    ports:
      - "3061:3000"
    environment:
      - PORT=3000
      - SERVICE_NAME=Backend-1
      - SUPABASE_URL=https://rnininxlmxdmcjooqwkc.supabase.co
      - SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJuaW5pbnhsbXhkbWNqb29xd2tjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk3MzM0NjcsImV4cCI6MjA3NTMwOTQ2N30.u3CByXWF-0KYXwiG0B8xp8_EfsCGDBXqh5oWFDBUPD8
      - PEER_URL=http://backend-2:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  backend-2:
    build: ./backend
    ports:
      - "3062:3000"
    environment:
      - PORT=3000
      - SERVICE_NAME=Backend-2
      - SUPABASE_URL=https://yvniowvaxuupfwgknzvy.supabase.co
      # Edge Functions for Backend 2:
      # - /functions/v1/save-search
      # - /functions/v1/scrape-linkedin-jobs
      # - /functions/v1/scrape-linkedin-people
      # - /functions/v1/search-router
      - SUPABASE_KEY=sb_publishable_NRNv47SPp5eszqGxrwzjpw_NoZo7ERe
      - PEER_URL=http://backend-1:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # --- Frontend Services ---
  frontend-1:
    build:
      context: ../
      dockerfile: Dockerfile.frontend
      args:
        - VITE_SUPABASE_URL=http://localhost:9090/api
        - VITE_SUPABASE_ANON_KEY=sb_publishable_NRNv47SPp5eszqGxrwzjpw_NoZo7ERe
    ports:
      - "3051:80"
    environment:
      - PORT=80
    restart: unless-stopped

  frontend-2:
    build:
      context: ../
      dockerfile: Dockerfile.frontend
      args:
        - VITE_SUPABASE_URL=http://localhost:9090/api
        - VITE_SUPABASE_ANON_KEY=sb_publishable_NRNv47SPp5eszqGxrwzjpw_NoZo7ERe
